add_newline = true
command_timeout = 500
format = "$directory$git_branch$git_status$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[ $symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"
truncation_length = 30

[git_status]
# Orden: conflictos > diverged > push > pull > staged > modificado > sin seguimiento
format = '([$all_status$ahead_behind]($style) )'
style = "bold yellow"

# Necesitas hacer PUSH (tienes commits locales sin subir)
ahead      = "[⇡PUSH×${count}](bold green) "
# Necesitas hacer PULL (hay commits en remoto sin bajar)
behind     = "[⇣PULL×${count}](bold red) "
# Diverged: necesitas pull + push (o rebase/merge)
diverged   = "[⇕SYNC ⇡${ahead_count}⇣${behind_count}](bold red) "

# Tienes conflictos de merge
conflicted = "[=MERGE](bold red) "

# Todo limpio
up_to_date = ""

# Archivos en staging (listos para commit)
staged     = "[+${count}](bold green)"
# Archivos modificados (no añadidos aún)
modified   = "[!${count}](bold yellow)"
# Archivos sin seguimiento (nuevos)
untracked  = "[?${count}](bold blue)"
# Archivos borrados
deleted    = "[✘${count}](bold red)"
# Archivos renombrados
renamed    = "[»${count}](bold cyan)"
# Stash guardado
stashed    = "[~${count}](bold cyan)"
