[mgr]
show_hidden = true
ratio = [1, 3, 4]
linemode = "size"
sort_dir_first = true

[opener]
edit = [
  { run = 'nvim %s', desc = "Editar con Neovim", block = true },
  { run = 'code %s', desc = "Editar con VisualStudio Code", block = true },
]
display = [
  { run = 'xdg-open %s', desc = "Abrir", orphan = true },
]
pdf = [
  { run = 'okular %s', desc = "Okular", orphan = true },
  { run = 'zathura %s', desc = "Zathura", orphan = true },
  { run = 'xournalpp %s', desc = "Xournal++", orphan = true },
  { run = 'rnote %s', desc = "Rnote", orphan = true },
]
xournal = [
  { run = 'xournalpp %s', desc = "Xournal++", orphan = true },
]
rnote = [
  { run = 'rnote %s', desc = "Rnote", orphan = true },
]
markdown = [
  { run = 'nvim %s', desc = "Editar con Neovim", block = true },
  { run = 'glow -p %s', desc = "Leer con glow", block = true },
]
latex = [
  { run = 'nvim %s',      desc = "Editar con Neovim", block = true },
]

[open]
prepend_rules = [
  { url = "**/*.xopp",   use = "xournal" },
  { url = "**/*.rnote", use = "rnote" },
  { url = "**/*.md",   use = "markdown" },
  { url = "**/*.tex",  use = "edit" },
  { url = "**/*.asm",  use = "edit" },
  { url = "**/*.s",    use = "edit" },
  { url = "**/*.S",    use = "edit" },
  { mime = "image/*",   use = "display" },
]

rules = [
  { mime = "application/x-xopp",        use = "xournal" },
  { mime = "text/*",                    use = "edit" },
  { mime = "application/json",          use = "edit" },
  { mime = "application/toml",          use = "edit" },
  { mime = "application/xml",           use = "edit" },
  { mime = "application/javascript",    use = "edit" },
  { mime = "application/x-shellscript", use = "edit" },
  { mime = "inode/x-empty",             use = "edit" },
  { mime = "application/pdf",           use = "pdf" },
]

# ---------------------------------------------------------------------------
# "Lazy yazi": plugins (ya pkg list) + previews
# ---------------------------------------------------------------------------
[preview]
max_width = 1200
max_height = 1800

# Estado git de cada archivo (M, A, ?, ...)
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Markdown renderizado con glow
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# Contenido de comprimidos (zip, tar, 7z, rar...) con ouch
[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"

# Árbol de directorios con eza
[[plugin.prepend_previewers]]
url = "*/"
run = 'piper -- eza -TL=2 --color=always --icons=always --group-directories-first --no-quotes "$1"'

# Binarios (ELF, .o, firmware...): volcado hexadecimal con hexyl
[[plugin.append_previewers]]
url = "*"
run = 'piper -- hexyl --border=none --terminal-width=$w "$1"'
