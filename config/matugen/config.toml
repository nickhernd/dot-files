[config]
prefer="darkness"

[settings]
mode = "dark"
scheme = "material"
palette = "material"

[templates.quickshell]
input_path  = "~/.config/matugen/templates/quickshell.json.hbs"
output_path = "~/.config/quickshell/colors/Colors.json"

[templates.cava]
input_path = "~/.config/matugen/templates/cava"
output_path = "~/.config/cava/config"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-color.rasi"
output_path = "~/.config/rofi/colors.rasi"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors.conf"
post_hook = "pkill -USR1 -x kitty || true"

[templates.hyprland_lua]
input_path = "~/.config/matugen/templates/hyprland.lua"
output_path = "~/.config/hypr/colors.lua"
post_hook = "hyprctl reload"
