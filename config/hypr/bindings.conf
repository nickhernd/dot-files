# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password
bindd = SUPER SHIFT, S, Captura de pantalla, exec, omarchy-cmd-screenshot
bindd = SUPER SHIFT, R, Grabar pantalla (toggle), exec, omarchy-cmd-record-toggle

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Resize windows with CTRL + arrow keys
bindde = CTRL, left,  Reducir ancho,  resizeactive, -40 0
bindde = CTRL, right, Aumentar ancho, resizeactive,  40 0
bindde = CTRL, up,    Reducir alto,   resizeactive,  0 -40
bindde = CTRL, down,  Aumentar alto,  resizeactive,  0  40

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Mouse mode (keyboard cursor control via ydotool — Wayland native)
# Activate with SUPER+ALT+M — use arrows/HJKL to move, Enter=click izq, ESC=salir
bindd = SUPER ALT, M, Activar control de ratón con teclado, exec, hyprctl keyword cursor:hide_on_key_press false && hyprctl keyword cursor:inactive_timeout 0 && notify-send -t 2000 "Mouse Mode" "Activado — Flechas/HJKL=mover, Enter=click, ESC=salir" && hyprctl dispatch submap mousemode

submap = mousemode

# Move cursor — normal speed (hold key to repeat)
binde = , left,  exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- -20 0
binde = , right, exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 20 0
binde = , up,    exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 -20
binde = , down,  exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 20
binde = , h,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- -20 0
binde = , l,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 20 0
binde = , k,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 -20
binde = , j,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 20

# Move cursor — fast (SHIFT + arrow/HJKL)
binde = SHIFT, left,  exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- -100 0
binde = SHIFT, right, exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 100 0
binde = SHIFT, up,    exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 -100
binde = SHIFT, down,  exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 100
binde = SHIFT, h,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- -100 0
binde = SHIFT, l,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 100 0
binde = SHIFT, k,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 -100
binde = SHIFT, j,     exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool mousemove -- 0 100

# Clicks  (0xC0=izq, 0xC1=der, 0xC2=medio: 0x40=down + 0x80=up + botón)
bind = , Return,       exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0xC0 # izquierda
bind = SHIFT, Return,  exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0xC1 # derecha
bind = , space,        exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0xC2 # medio

# Mantener pulsado = drag — suelta la tecla = suelta el botón
binde  = SHIFT, space, exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0x40
bindr = SHIFT, space, exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0x80

# Scroll (Re Pág=arriba, Av Pág=abajo)
binde = , Prior, exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0xC5
binde = , Next,  exec, YDOTOOL_SOCKET=/run/user/1000/.ydotool_socket ydotool click 0xC6

# Exit mouse mode
bind = , Escape, exec, hyprctl keyword cursor:hide_on_key_press true && hyprctl keyword cursor:inactive_timeout 3 && notify-send -t 1500 "Mouse Mode" "Desactivado" && hyprctl dispatch submap reset
bind = SUPER ALT, M, exec, hyprctl keyword cursor:hide_on_key_press true && hyprctl keyword cursor:inactive_timeout 3 && notify-send -t 1500 "Mouse Mode" "Desactivado" && hyprctl dispatch submap reset

submap = reset

bindd = SUPER, P, Alternar pantalla única/dual, exec, ~/.config/hypr/scripts/toggle-monitors.sh
