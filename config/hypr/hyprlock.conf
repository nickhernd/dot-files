source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/foto_galiciaa.JPG
    blur_passes = 1
    blur_size = 2
    brightness = 0.6
    contrast = 1.0
    vibrancy = 0.15
}

animations {
    enabled = false
}

label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(255, 255, 255, 0.9)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.8)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.7)
}

input-field {
    monitor =
    size = 650, 80
    position = 0, -100
    halign = center
    valign = center

    inner_color = rgba(30, 30, 46, 0.85)
    outer_color = rgba(137, 180, 250, 0.6)
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = #cdd6f4

    placeholder_text =  Contraseña
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_color = #f38ba8

    rounding = 12
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.6)
    fade_on_empty = false
}

auth {
    fingerprint:enabled = true
}
