# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Intel (card0) as primary renderer, NVIDIA (card1) secondary for HDMI-A-1 output.
# This order fixes EGL DMA-BUF import failures: NVIDIA can import Intel buffers,
# but Intel cannot import NVIDIA buffers (EGL_BAD_MATCH on eglCreateImageKHR).
# DP-4 (Intel) renders and displays without cross-GPU copy.
env = WLR_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1

# Straight 1x setup for low-resolution displays like 1080p or 1440p
env = GDK_SCALE,1
monitor = DP-4, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, 1920x1080@75, 1920x0, 1

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
# env = GDK_SCALE,2
# monitor=,preferred,auto,auto

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6
