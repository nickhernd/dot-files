# Tema base de Omarchy; si matugen ha generado colors.conf (rice) lo sobreescribe
include ~/.local/state/omarchy/current/theme/kitty.conf
globinclude colors.conf

# Fuente (más compacta)
font_family      JetBrainsMono Nerd Font
bold_italic_font auto
font_size        11.0

# Ventana
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.92

# Atajos
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
map ctrl+c copy_or_interrupt

# Control remoto (lo usa el rice para recargar colores)
allow_remote_control yes

# Estética
cursor_shape block
cursor_blink_interval 0
cursor_trail 1
shell_integration no-cursor
enable_audio_bell no

# Tab bar minimal
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
